<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Stock - Inicio de Sesión</title>
    <link rel="stylesheet" type="text/css" href="./css/cssiniciosesion.css">
    <script src="./javascript/jsiniciosesion.js" defer></script>
</head>
<body>

<main class="login-container">
    <img src="./imgstock/stockimage.jpeg" alt="Imagen de Login">
    
    <!-- Formulario de Inicio de Sesión -->
    <div id="login-form">
        <h2>Inicio de Sesión</h2>
        <form id="login-form-element">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Tu correo electrónico" required>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            <input type="submit" value="Iniciar Sesión">
            <p id="error-message" class="error-message" style="display: none;"></p>
        </form>
        <button type="button" data-accion="mostrar-registro">Registrar nuevo usuario</button>
        <button type="button" data-accion="volver">Volver atrás</button> <!-- Botón para volver atrás -->
    </div>

    <!-- Formulario de Registro -->
    <div id="registration-form" style="display: none;">
        <h2>Registro de Usuario</h2>
        <form id="register-form-element">
            <label for="register-email">Correo electrónico:</label>
            <input type="email" id="register-email" name="register-email" placeholder="Tu correo electrónico" required>
            <label for="register-password">Contraseña:</label>
            <input type="password" id="register-password" name="register-password" placeholder="Tu contraseña" required>
            <label for="confirm-password">Confirmar Contraseña:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirma tu contraseña" required>
            <input type="submit" value="Registrar">
            <p id="register-message" class="error-message" style="display: none;"></p>
        </form>
        <button type="button" data-accion="volver">Volver atrás</button> <!-- Botón para volver atrás -->
    </div>
</main>

</body>
</html>
