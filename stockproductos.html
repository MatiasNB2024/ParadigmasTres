<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock de Productos</title>
    <link rel="stylesheet" type="text/css" href="./css/cssproductosstock.css">
</head>
<body>

    <!-- Barra de navegación -->
    <div class="navbar">
        <a href="menuinicio.html">Inicio</a>
        <a href="stockproductos.php">Stock de Productos</a>
        <a href="productosrecibidos.html">Productos Recibidos</a>
        <a href="entregarproductos.html">Productos a Entregar</a>
    </div>

    <h2>Stock de Productos</h2>

    <!-- Formulario para agregar un producto -->
    <form method="POST" enctype="multipart/form-data">
        <table id="productTable">
            <thead>
                <tr>
                    <th>Imagen del Producto</th>
                    <th>Descripción del Producto</th>
                    <th>Cantidad</th>
                    <th>Fecha de Recepción</th>
                    <th>Proveedor</th>
                    <th>Precio de Compra Por Unidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <input type="file" name="image" accept="image/*" required>
                    </td>
                    <td><input type="text" name="productName" placeholder="Nombre del Producto" required></td>
                    <td><input type="number" name="quantity" placeholder="Cantidad" min="0" required></td>
                    <td><input type="date" name="receiptDate" required></td>
                    <td><input type="text" name="supplier" placeholder="Proveedor" required></td>
                    <td>
                        <div class="price-container">
                            <span>$</span><input type="number" name="purchasePrice" placeholder="0.00" min="0" step="0.01" required>
                        </div>
                    </td>
                    <td><button type="submit" name="save">Guardar</button></td>
                </tr>
            </tbody>
        </table>
    </form>
</body>
</html>
