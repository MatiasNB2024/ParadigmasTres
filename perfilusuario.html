<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Usuario</title>
    <link rel="stylesheet" type="text/css" href="./css/estilos.css">
</head>
<body>

    <!-- Barra de navegación (misma estructura que el resto de las secciones internas) -->
    <nav class="navbar">
        <a href="menuinicio.html">Inicio</a>
        <a href="stockproductos.html">Stock de Productos</a>
        <a href="productosrecibidos.html">Productos Recibidos</a>
        <a href="entregarproductos.html">Productos a Entregar</a>
        <div class="navbar-right">
            <a href="perfilusuario.html" class="perfil">Ver Perfil</a>
            <a href="iniciosesion.html" class="logout">Cerrar Sesión</a>
        </div>
    </nav>

    <!-- Contenido principal de la vista -->
    <main class="page">
        <h2 class="page-title">Perfil del Usuario</h2>

        <!-- Formulario para guardar los datos del perfil -->
        <form id="profileForm" class="profile-form" action="conexionperfil.php" method="POST">
            <div class="form-field">
                <label for="name">Nombre del Usuario:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-field">
                <label for="address">Dirección:</label>
                <input type="text" id="address" name="address" required>
            </div>

            <div class="form-field">
                <label for="phone">Teléfono:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-field">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-field">
                <label for="payment">Medio de Pago:</label>
                <select id="payment" name="payment">
                    <option value="tarjeta">Tarjeta de Crédito/Débito</option>
                    <option value="paypal">PayPal</option>
                    <option value="efectivo">Efectivo</option>
                    <option value="online">Mercado Pago</option>
                </select>
            </div>

            <div class="form-field">
                <label for="additionalInfo">Información Adicional:</label>
                <textarea id="additionalInfo" name="additionalInfo" rows="4" placeholder="Ingrese cualquier información adicional aquí..."></textarea>
            </div>

            <button type="submit" class="btn">Guardar Cambios</button>
        </form>

        <!-- Botón para volver al inicio -->
        <a href="menuinicio.html" class="btn btn-secondary">Volver al Menú de Inicio</a>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Benitez Despensas. Todos los derechos reservados.</p>
    </footer>

    <script>
        // Cargar datos del perfil desde localStorage
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('userProfile')) {
                const userProfile = JSON.parse(localStorage.getItem('userProfile'));
                document.getElementById('name').value = userProfile.name || '';
                document.getElementById('address').value = userProfile.address || '';
                document.getElementById('phone').value = userProfile.phone || '';
                document.getElementById('email').value = userProfile.email || '';
                document.getElementById('payment').value = userProfile.payment || 'tarjeta';
                document.getElementById('additionalInfo').value = userProfile.additionalInfo || '';
            }
        });

        // Guardar los datos del perfil en localStorage
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const userProfile = {
                name: document.getElementById('name').value,
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                payment: document.getElementById('payment').value,
                additionalInfo: document.getElementById('additionalInfo').value
            };

            // Guardar el perfil del usuario en localStorage
            localStorage.setItem('userProfile', JSON.stringify(userProfile));
            alert('Perfil guardado exitosamente');
        });
    </script>

</body>
</html>
